<div class="container">
    <div class="title"><strong>Example 2: </strong>Using Signals to show/hide a loading spinner</div><br>
    <div *ngIf="isLoading()">
        Loading...
    </div>
    <table *ngIf="!isLoading()" class="table">
        <thead>
            <tr>
                <th>userId</th>
                <th>Id</th>
                <th>title</th>
                <th>Body</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of listItem()">
                <td>{{item.userId}}</td>
                <td>{{item.id}}</td>
                <td>{{item.title}}</td>
                <td>{{item.body}}</td>
            </tr>
        </tbody>
    </table>
</div>
